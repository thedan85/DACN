spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true

app:
  auth:
    cookie-secure: true

# API docs are for local development only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
