spring:
  application:
    name: dacn
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecom}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Do not let RabbitAdmin declare/connect while delivery is disabled.
    dynamic: ${NOTIFICATIONS_DELIVERY_ENABLED:false}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: false
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1
        default-requeue-rejected: false
      direct:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false

server:
  port: 8080
  # Cloudflare Tunnel connects over loopback; never expose the app directly.
  address: 127.0.0.1
  # Cloudflare tunnel terminates TLS; use X-Forwarded-* so Swagger/redirects
  # generate https URLs instead of http ones.
  forward-headers-strategy: framework
  servlet:
    multipart:
      max-file-size: 10MB
      # Slightly above max-file-size: a 10MB file plus multipart overhead
      # must still fit inside the request limit.
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET:dev-secret-key-please-change-min-256-bits-hs256-algorithm-requires-this-length}
  access-token-expiration-ms: 900000      # 15 minutes
  refresh-token-expiration-ms: 604800000  # 7 days

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: ${CLOUDINARY_SECURE:true}

payment:
  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    endpoint: ${MOMO_ENDPOINT:}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Set true in production (HTTPS). Local dev over http must stay false.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Use None only when frontend and API are on different registrable domains.
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  notifications:
    delivery-enabled: ${NOTIFICATIONS_DELIVERY_ENABLED:false}
    relay-interval-ms: 500
    rabbit:
      management-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      management-username: ${RABBITMQ_MANAGEMENT_USERNAME:guest}
      management-password: ${RABBITMQ_MANAGEMENT_PASSWORD:guest}
      expected-version-prefix: ${RABBITMQ_EXPECTED_VERSION:4.4}
      confirm-timeout: 5s
  realtime:
    enabled: ${REALTIME_ENABLED:false}
    retention-enabled: ${REALTIME_RETENTION_ENABLED:true}
    supabase-url: ${SUPABASE_URL:}
    signing-key-id: ${SUPABASE_REALTIME_SIGNING_KEY_ID:}
    private-key: ${SUPABASE_REALTIME_PRIVATE_KEY:}
    # Leave blank unless a trusted reverse proxy overwrites this header.
    # Blank means use request.getRemoteAddr() and ignore all forwarding headers.
    trusted-client-ip-header: ${REALTIME_TRUSTED_CLIENT_IP_HEADER:}

shipping:
  ghtk:
    base-url: ${GHTK_BASE_URL:}
    token: ${GHTK_TOKEN:}
  ghn:
    base-url: ${GHN_BASE_URL:https://online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
