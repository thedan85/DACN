spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:ecom_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

# Dummy values so CloudinaryConfig does not throw in full-context tests.
# Real credentials live in .env and are never committed.
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret
