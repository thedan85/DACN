spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:ecom_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

# Dummy values so CloudinaryConfig does not throw in full-context tests.
# Real credentials live in .env and are never committed.
# Placeholder credentials so the full application context can start in tests
# without external secrets. No network calls are made at startup.
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret
  secure: true

jwt:
  secret: test-secret-key-please-change-min-256-bits-hs256-algorithm-requires-this-length
