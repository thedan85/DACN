name: Backend tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test
      - name: Require PostgreSQL tests to run
        run: |
          for report in \
            target/surefire-reports/TEST-com.project.dacn.CustomerOrderSearchPostgresTest.xml \
            target/surefire-reports/TEST-com.project.dacn.db.OrderIndexMigrationTest.xml; do
            test -f "$report"
            if grep -q 'skipped="[1-9]' "$report"; then
              echo "PostgreSQL tests were skipped: $report"
              exit 1
            fi
          done
